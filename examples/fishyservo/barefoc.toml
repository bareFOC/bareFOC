[board]
name = "fishyservo-stm32h5"
description = "FishyServo Quad H-Bridge Multi-Topology Servo (STM32H503KB)"
mcu = "stm32h503kbu6"
status_leds = ["!PA1", "PA0"]
vbus_adc_peripheral = "ADC1"
vbus_adc_pin = "PB1"
vbus_divider_scale = 4.703704

[communication.i3c2]
bootloader = true
scl_pin = "PB3"
sda_pin = "PB4"
bitrate = 1000000
address = 0x40

[communication.i2c1]
role = "master"
scl_pin = "PB6"
sda_pin = "PB7"

[bootloader]
type = "bareboot"
status_led = "!PA1"
mailbox_address = 0x20007FE0

[safety]
max_voltage_v = 6.0
max_current_a = 2.0
max_velocity_rad_s = 50.0
temp_limit_mosfet_c = 85.0

[defaults]
node_id = 64
pole_pairs = 1
voltage_limit = 5.0
current_limit = 1.0
velocity_limit = 50.0
pid_velocity_p = 0.5
pid_velocity_i = 1.0
pid_velocity_d = 0.0
pid_velocity_output_ramp = 100.0
pid_angle_p = 20.0
pid_angle_i = 0.0
pid_angle_d = 0.1
lpf_velocity_tf = 0.02
lpf_angle_tf = 0.0

[kinematics]
topology = "four_1dof"
sensor_map = [0, 1, 2, 3]

[gate_driver]
type = "drv8411a"
topology = "h_bridge"
high_pwm_pin = ["PA9", "PA8", "PA6", "PA15"]
low_pwm_pin = ["PB0", "PB15", "PA7", "PB5"]
current_sense = "lowside"
current_adc_pin = ["PA5", "PA3", "PA4", "PA2"]
ripropi_ohms = 1000.0

[sensor.s0]
type = "tmag5273"
bus = "i2c1"
motor = 0

[sensor.s1]
type = "tmag5273"
bus = "i2c1"
motor = 1

[sensor.s2]
type = "tmag5273"
bus = "i2c1"
motor = 2

[assets]
bootloader_bin = "bareboot-stm32h503-i3c-i2c.bin"
firmware_bin = "fishyservo_stm32h5_i3c.bin"
