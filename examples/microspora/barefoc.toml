[board]
name = "microspora-stm32g4"
description = "MicroSpora BLDC FOC Motor Driver (STM32G431CBU6 + DRV8316 + MT6701)"
mcu = "stm32g431cbu6"
family = "stm32g4"
system_clock_hz = 170000000

[communication.host]
protocol = "can"
role = "target"
bootloader = false
peripheral = "FDCAN1"
tx_scl_pin = "PB9"
rx_sda_pin = "PB8"
can_enable_pin = "PC13"
bitrate = 1000000

[communication.encoder_bus]
protocol = "spi"
role = "master"
peripheral = "SPI1"
sck_pin = "PA5"
miso_pin = "PA6"
mosi_pin = "PA7"

[bootloader]
enabled = false
type = "bareboot"
boot_window_ms = 250
preserve_nvm = true
status_led = "PC6"

[safety]
max_voltage_v = 24.0
max_current_a = 8.0
max_velocity_rad_s = 100.0
temp_limit_mosfet_c = 85.0

[defaults]
node_id = 1
pole_pairs = 7
voltage_limit = 6.0
current_limit = 2.0
velocity_limit = 50.0
pid_velocity_p = 0.25
pid_velocity_i = 3.5
pid_velocity_d = 0.001
pid_velocity_output_ramp = 100.0
pid_angle_p = 20.0
pid_angle_i = 0.0
pid_angle_d = 0.05
lpf_velocity_tf = 0.015
lpf_angle_tf = 0.0

[kinematics]
gear_ratio = 1.0

[gate_driver]
driver_type = "drv8316"
pwm_frequency_hz = 25000
pwm_timer = "TIM1"
inh_a = "PA10"
inh_b = "PA9"
inh_c = "PA8"
inl_a = "PB15"
inl_b = "PB14"
inl_c = "PB13"
cs_pin = "!PC4"
spi_bus = "SPI3"
spi_sck_pin = "PB3"
spi_mosi_pin = "PB5"
spi_miso_pin = "PB4"

[sensor.motor]
type = "mt6701"
bus = "encoder_bus"
cs_pin = "!PA4"
cpr = 16384
