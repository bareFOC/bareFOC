[board]
name = "microspora-stm32g4"
description = "MicroSpora BLDC FOC Motor Driver (STM32G431CBU6 + DRV8316 + MT6701)"
mcu = "stm32g431cbu6"
status_leds = ["PC6"]
vbus_adc_peripheral = "ADC1"
vbus_adc_pin = "PB11"
vbus_divider_scale = 11.0

[communication.fdcan1]
tx_pin = "PB9"
rx_pin = "PB8"
can_enable_pin = "PC13"
bitrate = 1000000

[communication.spi1]
role = "master"
sck_pin = "PA5"
miso_pin = "PA6"
mosi_pin = "PA7"

[bootloader]
enabled = false
status_led = "PC6"

[safety]
max_voltage_v = 24.0
max_current_a = 8.0
max_velocity_rad_s = 100.0
temp_limit_mosfet_c = 85.0

[defaults]
node_id = 1
pole_pairs = 7
voltage_limit = 6.0
current_limit = 2.0
velocity_limit = 50.0
pid_velocity_p = 0.25
pid_velocity_i = 3.5
pid_velocity_d = 0.001
pid_velocity_output_ramp = 100.0
pid_angle_p = 20.0
pid_angle_i = 0.0
pid_angle_d = 0.05
lpf_velocity_tf = 0.015
lpf_angle_tf = 0.0

[gate_driver]
type = "drv8316"
topology = "half_bridge"
high_pwm_pin = ["PA10", "PA9", "PA8"]
low_pwm_pin = ["PB15", "PB14", "PB13"]
cs_pin = "!PC4"
spi_bus = "SPI3"
spi_sck_pin = "PB3"
spi_mosi_pin = "PB5"
spi_miso_pin = "PB4"

[sensor.motor]
type = "mt6701"
bus = "spi1"
cs_pin = "!PA4"
