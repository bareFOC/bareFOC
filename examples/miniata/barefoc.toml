[board]
name = "miniata-stm32h5"
description = "Miniata Ultra-Compact Integrated FOC Actuator (STM32H503KB)"
mcu = "stm32h503kbu6"
status_leds = ["PC14", "PB8"]

[communication.uart1]
bootloader = true
alt_i2c_peripheral = "I2C1"
tx_pin = "PB6"
rx_pin = "PB7"
bitrate = 250000

[bootloader]
type = "katapult"
mailbox_address = 0x20007FF8

[safety]
max_voltage_v = 12.6
max_current_a = 5.0
max_velocity_rad_s = 200.0
temp_limit_mosfet_c = 85.0

[defaults]
node_id = 1
pole_pairs = 7
voltage_limit = 6.0
current_limit = 2.0
velocity_limit = 100.0
pid_velocity_p = 0.25
pid_velocity_i = 3.5
pid_velocity_d = 0.001
pid_velocity_output_ramp = 100.0
pid_angle_p = 25.0
pid_angle_i = 0.0
pid_angle_d = 0.05
lpf_velocity_tf = 0.015
lpf_angle_tf = 0.0

[gate_driver]
type = "drv8311"
topology = "half_bridge"
pwm_pin = ["PB5", "PA9", "PA8"]
en_pin = ["PB1", "PB0", "PA7"]
sleep_pin = "PB15"
fault_pin = "^!PB12"

[sensor.motor]
type = "mt6701_ssi"
bus = "SPI2"
clk_pin = "PA12"
data_pin = "PA15"
cs_pin = "!PA11"

[sensor.output]
type = "mt6701_ssi"
bus = "SPI2"
cs_pin = "!PC15"

[assets]
bootloader_bin = "katapult_uart.bin"
firmware_bin = "firmware_miniata.bin"
